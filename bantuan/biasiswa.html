<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biasiswa &amp; Pinjaman Pendidikan | MyBantuan</title>
  <meta name="description" content="Senarai biasiswa dan pinjaman pendidikan Malaysia — JPA, MARA, PTPTN, PETRONAS, Khazanah dan lain-lain.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo" style="text-decoration:none;color:inherit">
        <span class="logo-mark">MB</span>
        <div class="logo-text"><strong>MyBantuan</strong><span>&amp; Tax Calc</span></div>
      </a>
      <nav class="main-nav" aria-label="Utama">
        <a href="../index.html">Utama</a>
        <a href="index.html">Bantuan</a>
        <a href="biasiswa.html" class="active" aria-current="page">Biasiswa</a>
        <a href="../universiti/index.html">Universiti</a>
      </nav>
    </div>
  </header>

  <section class="page-head">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb" style="margin-bottom:12px"><a href="../index.html">Laman Utama</a><span aria-hidden="true">›</span><span>Biasiswa</span></nav>
      <h1>Biasiswa &amp; Pinjaman Pendidikan</h1>
      <p>Klik kad untuk panduan lengkap. Butang permohonan rasmi ada di halaman detail.</p>
    </div>
  </section>

  <main class="container">

    <div class="toolbar" role="search">
      <div class="search-box">
        <input type="search" id="search" placeholder="Cari nama atau penyedia, contoh: PTPTN" autocomplete="off" aria-label="Cari biasiswa">
      </div>

      <div class="chip-row" data-group="prov" role="group" aria-label="Penyedia">
        <span class="chip-label">Penyedia</span>
        <button class="chip-btn" data-value="" aria-pressed="true">Semua</button>
        <button class="chip-btn" data-value="government" aria-pressed="false">Kerajaan</button>
        <button class="chip-btn" data-value="corporate" aria-pressed="false">Korporat / GLC</button>
        <button class="chip-btn" data-value="foundation" aria-pressed="false">Yayasan</button>
      </div>

      <div class="chip-row" data-group="type" role="group" aria-label="Jenis">
        <span class="chip-label">Jenis</span>
        <button class="chip-btn" data-value="" aria-pressed="true">Semua</button>
        <button class="chip-btn" data-value="scholarship" aria-pressed="false">Biasiswa</button>
        <button class="chip-btn" data-value="loan" aria-pressed="false">Pinjaman</button>
        <button class="chip-btn" data-value="convertible-loan" aria-pressed="false">Pinjaman Boleh Ubah</button>
      </div>

      <div class="chip-row">
        <label class="chip-label" for="f-level">Peringkat</label>
        <select id="f-level">
          <option value="">Semua peringkat</option>
          <option value="spm">SPM / Pra-U</option>
          <option value="foundation">Asasi</option>
          <option value="diploma">Diploma</option>
          <option value="degree">Ijazah</option>
          <option value="master">Sarjana</option>
          <option value="phd">PhD</option>
        </select>
      </div>
    </div>

    <div class="result-bar">
      <span><strong id="count">—</strong> program</span>
      <button class="link-btn" id="clear" hidden>Kosongkan penapis</button>
    </div>

    <div class="sch-grid" id="grid" aria-live="polite">
      <p class="empty">Memuat...</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p class="copyright">© 2026 MyBantuan &amp; Tax Calc</p></div>
  </footer>

  <script>
    const PROVIDER_LABEL = { government: 'Kerajaan', corporate: 'Korporat / GLC', foundation: 'Yayasan' };
    const TYPE_LABEL = { scholarship: 'Biasiswa', loan: 'Pinjaman', 'convertible-loan': 'Pinjaman Boleh Ubah' };
    const LEVEL_LABEL = { spm: 'SPM / Pra-U', foundation: 'Asasi', diploma: 'Diploma', degree: 'Ijazah', master: 'Sarjana', phd: 'PhD' };
    const TYPE_TAG = { scholarship: 'tag', loan: 'tag tag-loan', 'convertible-loan': 'tag tag-loan' };
    const PROVIDER_TAG = { government: 'tag', corporate: 'tag tag-corp', foundation: 'tag tag-found' };
    const PROVIDER_CARD = { government: '', corporate: ' sch-corp', foundation: ' sch-found' };

    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function card(s, lead) {
      const tags =
        `<span class="${PROVIDER_TAG[s.providerType] || 'tag'}">${esc(PROVIDER_LABEL[s.providerType] || s.providerType)}</span>` +
        `<span class="${TYPE_TAG[s.aidType] || 'tag'}">${esc(TYPE_LABEL[s.aidType] || s.aidType)}</span>`;
      const levels = (s.studyLevels || []).map(l => LEVEL_LABEL[l] || l).join(' · ');
      const deadline = s.deadline
        ? `<span class="sch-meta"><span class="sch-deadline">Tutup: ${esc(s.deadline)}</span></span>`
        : `<span class="sch-meta">${esc(s.statusNote || 'Semak portal rasmi')}</span>`;
      // Always local detail page first — official apply button is on the detail page
      return `
        <a class="sch${PROVIDER_CARD[s.providerType] || ''}${lead ? ' sch-lead' : ''}" href="${esc(s.detailPage || s.id + '.html')}">
          <div class="sch-tags">${tags}</div>
          <h2 class="sch-title">${esc(s.name)}</h2>
          <p class="sch-desc">${esc(s.eligibilitySummary || s.amountSummary || '')}</p>
          ${levels ? `<p class="sch-levels">${esc(levels)}</p>` : ''}
          <div class="sch-foot"><div>
            ${s.amountSummary ? `<span class="sch-amount">${esc(s.amountSummary)}</span>` : ''}
            ${deadline}
            <span class="sch-meta">${esc(s.provider)}</span>
          </div></div>
        </a>`;
    }

    async function init() {
      const grid = document.getElementById('grid');
      let all = [];
      try {
        const res = await fetch('../data/scholarships.json');
        const data = await res.json();
        all = data.scholarships || [];
      } catch (e) {
        grid.innerHTML = '<p class="empty">Gagal memuat data.</p>';
        return;
      }

      const search = document.getElementById('search');
      const fLevel = document.getElementById('f-level');
      const clearBtn = document.getElementById('clear');
      const state = { prov: '', type: '' };

      function apply() {
        const q = (search.value || '').toLowerCase().trim();
        let list = all.slice();
        if (state.prov) list = list.filter(s => s.providerType === state.prov);
        if (state.type) list = list.filter(s => s.aidType === state.type);
        if (fLevel.value) list = list.filter(s => (s.studyLevels || []).includes(fLevel.value));
        if (q) {
          list = list.filter(s =>
            s.name.toLowerCase().includes(q) ||
            (s.provider || '').toLowerCase().includes(q) ||
            (s.tags || []).some(t => t.toLowerCase().includes(q))
          );
        }
        list.sort((a, b) => (b.priority || 0) - (a.priority || 0));

        const filtered = !!(q || state.prov || state.type || fLevel.value);
        clearBtn.hidden = !filtered;
        document.getElementById('count').textContent = list.length;

        grid.innerHTML = list.length
          // Unfiltered view: the top-priority program becomes the lead story
          ? list.map((s, i) => card(s, !filtered && i === 0 && list.length > 2)).join('')
          : '<div class="empty"><p>Tiada program dijumpai.</p><button class="link-btn" id="clear2">Kosongkan penapis</button></div>';
        const c2 = document.getElementById('clear2');
        if (c2) c2.addEventListener('click', reset);
      }

      function setChip(group, value) {
        state[group] = value;
        document.querySelectorAll(`.chip-row[data-group="${group}"] .chip-btn`).forEach(b =>
          b.setAttribute('aria-pressed', String(b.dataset.value === value)));
      }
      function reset() {
        search.value = ''; fLevel.value = '';
        setChip('prov', ''); setChip('type', '');
        apply();
      }

      document.querySelectorAll('.chip-row[data-group]').forEach(row =>
        row.addEventListener('click', e => {
          const b = e.target.closest('.chip-btn'); if (!b) return;
          setChip(row.dataset.group, b.dataset.value); apply();
        }));
      search.addEventListener('input', apply);
      fLevel.addEventListener('change', apply);
      clearBtn.addEventListener('click', reset);
      apply();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
